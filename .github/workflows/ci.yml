name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          # The floor this project declares in package.json engines. Running CI on the
          # floor rather than on whatever is newest is what makes that declaration true.
          node-version: 20
          cache: npm
      - run: npm ci
      # Run the three separately rather than through `npm run verify`, so a failure names
      # itself in the checks list instead of every failure reading as "verify".
      - run: npm run lint
      - run: npm run build
      - run: npm test

  # Every source-changing commit records the practices it was held to, so
  # provision-before-code is structural rather than something the author remembers.
  practices:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require a Practices trailer on source-changing commits
        run: bash scripts/check-practices-trailer.sh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
