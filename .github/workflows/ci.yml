name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          # The floor this project declares in package.json engines. Running CI on the
          # floor rather than on whatever is newest is what makes that declaration true.
          node-version: 20
          cache: npm
      - run: npm ci
      # Run the three separately rather than through `npm run verify`, so a failure names
      # itself in the checks list instead of every failure reading as "verify".
      - run: npm run lint
      - run: npm run build
      - run: npm test
