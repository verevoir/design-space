name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    # A hung checkout or npm registry call would otherwise hold a runner open until the
    # repository-wide 6h ceiling. The build takes well under a minute; 10 is generous.
    timeout-minutes: 10
    steps:
      # Third-party actions are pinned to immutable commit SHAs, not floating major tags.
      # A tag is mutable: whoever controls the action can repoint v6 at new code, and it
      # runs here with the repository token. The trailing comment records the human-readable
      # version so the pin stays legible and can be bumped deliberately.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # The floor package.json declares. Running CI on the floor rather than on
          # whatever is newest is what makes that declaration true.
          node-version: 20
          cache: npm
      - run: npm ci
      # Dependency vulnerability scan — npm audit is built in and needs no third-party action,
      # which is deliberately consistent with the supply-chain posture above: adding an unpinned
      # scanner action to satisfy a supply-chain finding would be self-defeating.
      #
      # Threshold: --audit-level=high
      #   Critical and high severities block the build; moderate and low are reported in the
      #   step output but do not fail it. The rationale: moderate advisories in a dev-only
      #   transitive dependency (a common shape for a TypeScript toolchain like this one) are
      #   almost never exploitable in context and are often unfixable by the PR author because
      #   they live in a pinned sub-dependency of eslint, vitest, or typescript. A gate that
      #   fires on moderate trains authors to add --audit-level=moderate to their local run to
      #   silence it, which defeats the gate entirely. High and critical advisories are
      #   exploitable and warrant a genuine fix or a documented exception; blocking on them is
      #   a real signal, not noise.
      #
      # Block vs. report: this step BLOCKS on high/critical.
      #   The fixability condition is met at high/critical: a package at that severity level
      #   will have a patched version available (npm audit fix will say so), so the PR author
      #   can act. If a high/critical CVE is in a pinned transitive with no fix available,
      #   the correct response is an explicit override (npm audit --ignore) committed with a
      #   rationale, not silently lowering the gate. That override is itself a reviewable
      #   artefact, which is the right place for that decision to live.
      - run: npm audit --audit-level=high
      # Separate steps rather than one `npm run verify`, so a failure names itself in the
      # checks list instead of every failure reading as "verify".
      - run: npm run lint
      - run: npm run build
      - run: npm test
